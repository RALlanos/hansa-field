name: hansa-field

services:
  database:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hansa_field}
      POSTGRES_USER: ${POSTGRES_USER:-hansa_field}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5434:5432"
    volumes:
      - hansa_field_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  hansa_field_postgres:
